[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regaudit"
version = "0.1.0"
description = "Offline draft regulatory audit contracts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
regaudit = "regaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
