name: G3 television exact-SKU collection

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful G3 TV source reconnaissance run ID (blank uses latest success)
        required: false
        type: string
  workflow_run:
    workflows: [G3 television source reconnaissance]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-tv-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked browser runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Download source population and collect assigned exact SKUs
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-tv-source-recon.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_number) | last | .id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g3-tv-source-recon.yml") | .id')"
          test "$VALID_RUN" = "$SOURCE_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-tv-source-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g3-tv/recon
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-tv/source.zip
          unzip -q runtime/g3-tv/source.zip -d runtime/g3-tv/recon
          RECON_FILE="$(find runtime/g3-tv/recon -name recon.json -type f -print -quit)"
          test -n "$RECON_FILE"
          echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}" >> "$GITHUB_ENV"
          python scripts/g3_tv_collect_shard.py --recon-root "$(dirname "$RECON_FILE")" --source-run-id "$SOURCE_RUN_ID" --shard-index "$SHARD_INDEX" --shard-count 8 --out runtime/g3-tv/shard
      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-tv-collection-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: runtime/g3-tv/shard/
          retention-days: 14
          if-no-files-found: warn

  assemble:
    if: always() && needs.collect.result != 'cancelled'
    needs: [collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Download source population and all completed collection shards
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-tv-source-recon.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_number) | last | .id')"
          fi
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-tv-source-"))] | sort_by(.created_at) | last | .id')"
          mkdir -p runtime/g3-tv/recon runtime/g3-tv/shards
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-tv/source.zip
          unzip -q runtime/g3-tv/source.zip -d runtime/g3-tv/recon
          while IFS=$'\t' read -r artifact_id artifact_name; do
            [ -n "$artifact_id" ] || continue
            mkdir -p "runtime/g3-tv/shards/${artifact_name}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "runtime/g3-tv/${artifact_name}.zip"
            unzip -q "runtime/g3-tv/${artifact_name}.zip" -d "runtime/g3-tv/shards/${artifact_name}"
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"g3-tv-collection-shard-${GITHUB_RUN_ID}-\")) | [.id,.name] | @tsv")
          RECON_FILE="$(find runtime/g3-tv/recon -name recon.json -type f -print -quit)"
          echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}" >> "$GITHUB_ENV"
          echo "RECON_DIR=$(dirname "$RECON_FILE")" >> "$GITHUB_ENV"
          echo "SHARDS_DIR=runtime/g3-tv/shards" >> "$GITHUB_ENV"
      - name: Assemble complete evidence and fail on unverified identities
        id: assemble
        continue-on-error: true
        run: python scripts/g3_tv_aggregate_shards.py --recon-root "$RECON_DIR" --source-run-id "$SOURCE_RUN_ID" --shards-root "$SHARDS_DIR" --out runtime/g3-tv/combined
      - name: Preserve complete TV collection artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-tv-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/g3-tv/combined/collection-summary.json
            runtime/g3-tv/combined/population.json
            runtime/g3-tv/combined/products.json
            runtime/g3-tv/combined/pdp/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if collection did not verify the full population
        if: always()
        run: test "${{ steps.assemble.outcome }}" = success && test "${{ needs.collect.result }}" = success
