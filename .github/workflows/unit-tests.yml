name: Unit test contracts
on:
  push:
    branches: [main, 'fix/**']
    paths:
      - '.github/workflows/**'
      - '.python-version'
      - 'requirements-*.lock'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.python-version'
      - 'requirements-*.lock'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Install locked test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir --require-hashes --no-deps -r requirements-tools.lock
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir --require-hashes --no-deps --no-build-isolation -r requirements-probe.lock
          python -m pip check
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -t . -v
