name: Dashboard accepted-family integration gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/integration-manifest.json'
      - 'docs/model-data.json'
      - 'docs/report-data.csv'
      - 'docs/report-all-fields.csv'
      - 'docs/report-data.xlsx'
      - 'docs/history.json'
      - 'docs/app.js'
      - 'scripts/audit_history.py'
      - 'scripts/test_audit_history.py'
      - 'scripts/test_operations.py'
      - 'scripts/publication_bundle.py'
      - 'scripts/reconcile_history_ruleset.py'
      - 'scripts/g3_range_collect.py'
      - 'scripts/test_range_retry.py'
      - 'scripts/dashboard_integration_gate.py'
      - '.github/workflows/dashboard-integration.yml'

permissions:
  actions: read
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Replay finding history lifecycle cases
        run: python scripts/test_audit_history.py
      - name: Inject source, OCR, EPA, artifact and publication failures
        run: python scripts/test_operations.py > runtime-operations-test.log
      - name: Verify bounded exact-SKU Range retry
        run: python scripts/test_range_retry.py
      - name: Verify current publication bundle identity and hashes
        shell: bash
        run: |
          run_id="$(python -c 'import json; print(json.load(open("docs/publication-manifest.json"))["run_id"])')"
          source_sha="$(python -c 'import json; print(json.load(open("docs/publication-manifest.json"))["source_git_sha"])')"
          python scripts/publication_bundle.py verify --docs docs --run-id "$run_id" --source-sha "$source_sha"
      - name: Download exact accepted family assessment artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/accepted-artifacts.tsv"
          import json
          for item in json.load(open('docs/integration-manifest.json', encoding='utf-8'))['accepted_family_artifacts']:
              print('\t'.join(str(item[key]) for key in ('family', 'run_id', 'workflow_path', 'artifact_prefix', 'report_file')))
          PY
          while IFS=$'\t' read -r family run_id workflow prefix report_file; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.status' <<< "$run")" = completed
            test "$(jq -r '.conclusion' <<< "$run")" = success
            test "$(jq -r '.path' <<< "$run")" = "$workflow"
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              | jq -c --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | last')"
            test "$artifact" != null
            artifact_id="$(jq -r '.id' <<< "$artifact")"
            expected_digest="$(jq -r '.digest' <<< "$artifact")"
            mkdir -p "runtime/integration/${family}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "runtime/integration/${family}.zip"
            actual_digest="sha256:$(sha256sum "runtime/integration/${family}.zip" | cut -d' ' -f1)"
            test "$actual_digest" = "$expected_digest"
            unzip -q "runtime/integration/${family}.zip" -d "runtime/integration/${family}"
            test -f "runtime/integration/${family}/${report_file}"
          done < "$RUNNER_TEMP/accepted-artifacts.tsv"
      - name: Download and verify unified source gate when declared
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(python -c 'import json; print(json.load(open("docs/integration-manifest.json", encoding="utf-8")).get("unified_source_run_id") or "")')"
          if [ -n "$run_id" ]; then
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              | jq -c --arg prefix "unified-full-audit-report-${run_id}-" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | last')"
            test "$artifact" != null
            mkdir -p runtime/unified-report
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$(jq -r '.id' <<< "$artifact")/zip" > runtime/unified-report.zip
            expected="$(jq -r '.digest' <<< "$artifact")"
            actual="sha256:$(sha256sum runtime/unified-report.zip | cut -d' ' -f1)"
            test "$actual" = "$expected"
            unzip -q runtime/unified-report.zip -d runtime/unified-report
            test -f runtime/unified-report/unified-report.json
          fi
      - name: Reconcile accepted artifacts and all Pages exports
        shell: bash
        run: |
          args=(--docs docs --manifest docs/integration-manifest.json --artifacts-root runtime/integration --out runtime/integration/report)
          if [ -f runtime/unified-report/unified-report.json ]; then
            args+=(--unified-report runtime/unified-report/unified-report.json)
          fi
          python scripts/dashboard_integration_gate.py "${args[@]}"
      - name: Show integration readiness
        if: always()
        shell: bash
        run: |
          if [ -f runtime/integration/report/integration-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('runtime/integration/report/integration-report.json', encoding='utf-8'))
          print('# Dashboard integration gate')
          print(f"Execution: **{d['execution_status']}**; formal readiness: **{d['formal_readiness']}**")
          print(f"Dashboard Run #{d['dashboard_run_number']}: {d['model_count']} models across {d['family_count']} families")
          print(f"Accepted family artifacts: {len(d['accepted_family_artifacts'])}; pending family gates: {len(d['pending_family_gates'])}")
          print(f"One source execution: {d['single_source_run']}")
          for item in d['pending_family_gates']:
              print(f"- {item['family']}: {item['reason']}")
          PY
          fi
      - name: Preserve integration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/integration/report/
          retention-days: 14
          if-no-files-found: warn
