name: Unified 11-family full audit

on:
  workflow_dispatch:
  schedule:
    - cron: '13 0 * * 1'

permissions:
  contents: read

concurrency:
  group: unified-full-audit
  cancel-in-progress: false

jobs:
  family:
    name: Acquire and assess ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [refrigerator, dishwasher, washer, tv, range, cooktop, dryer, hood, monitor, computer, tablet]
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked browser, PDF and OCR runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Acquire current sources and apply approved family controls
        run: python scripts/unified_family_run.py --family '${{ matrix.family }}'
      - name: Preserve this family's raw sources and assessment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-family-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.family }}
          path: |
            runtime/unified/${{ matrix.family }}/
            runtime/source-recon/${{ matrix.family }}/
            runtime/source-recon/chromebook/
            runtime/g2/
          retention-days: 90
          if-no-files-found: warn

  integrate:
    name: Verify one source run and 11 graded populations
    if: always()
    needs: [family]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Download family artifacts from every attempt of this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        continue-on-error: true
        with:
          pattern: unified-family-${{ github.run_id }}-*-*
          path: runtime/family-artifacts/
      - name: Select the latest successful attempt for each family
        run: python scripts/merge_unified_family_artifacts.py --artifacts-root runtime/family-artifacts --run-id '${{ github.run_id }}' --out runtime
      - name: Reconcile all family artifacts and source identities
        if: always()
        run: python scripts/unified_run_gate.py --root runtime --run-id '${{ github.run_id }}' --out runtime/unified-gate
      - name: Require all family jobs to have succeeded
        if: always()
        run: test '${{ needs.family.result }}' = success
      - name: Preserve integrated execution report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-full-audit-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/unified-gate/
          retention-days: 90
          if-no-files-found: warn

  build:
    name: Build validated Pages snapshot from this run
    needs: [family, integrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Install spreadsheet export dependency
        run: python -m pip install --no-cache-dir openpyxl==3.1.5 playwright==1.63.0
      - name: Install browser for desktop and mobile smoke
        run: python -m playwright install --with-deps chromium
      - name: Download source artifacts from every attempt of this execution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: unified-family-${{ github.run_id }}-*-*
          path: runtime/family-artifacts/
      - name: Select the latest successful source attempt for each family
        run: python scripts/merge_unified_family_artifacts.py --artifacts-root runtime/family-artifacts --run-id '${{ github.run_id }}' --out runtime
      - name: Download accepted source gate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: unified-full-audit-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/unified-gate/
      - name: Build and gate exactly one source snapshot
        run: |
          python scripts/test_audit_history.py
          python scripts/test_operations.py > runtime/operations-test.log
          python scripts/unified_pages_refresh.py --docs docs --artifacts-root runtime --unified-report runtime/unified-gate/unified-report.json --out runtime/validated-site --attempt '${{ github.run_attempt }}'
          python scripts/publication_bundle.py create --docs runtime/validated-site/docs --run-id '${{ github.run_id }}' --source-sha '${{ github.sha }}'
          python scripts/publication_bundle.py verify --docs runtime/validated-site/docs --run-id '${{ github.run_id }}' --source-sha '${{ github.sha }}'
          test "$(du -sb runtime/validated-site/docs | cut -f1)" -le 1073741824
      - name: Verify desktop, mobile, filters, links and browser errors before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory runtime/validated-site/docs > runtime/site-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/pages_smoke.py --base http://127.0.0.1:8765/ --run-id '${{ github.run_id }}'
      - name: Preserve validated site for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/validated-site/docs/
          retention-days: 90
          if-no-files-found: error
      - name: Upload exact validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: runtime/validated-site/docs/

  persist:
    name: Save the validated snapshot and guard publication order
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: validated-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/published-docs/
      - name: Verify artifact identity and prevent an older run overwriting main
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publication_bundle.py verify --docs runtime/published-docs --run-id '${{ github.run_id }}' --source-sha '${{ github.sha }}'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '${{ github.sha }}'
          cp -a runtime/published-docs/. docs/
          git add docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish validated unified audit run ${{ github.run_id }}'
          git push origin HEAD:main

  deploy:
    name: Deploy only the validated artifact
    needs: [build, persist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-smoke:
    name: Confirm the public project path has this run
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Install browser for published desktop and mobile checks
        run: |
          python -m pip install --no-cache-dir playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify the public Pages bundle and source identity
        run: python scripts/pages_smoke.py --base https://empty-bell.github.io/RDA/ --run-id '${{ github.run_id }}'
