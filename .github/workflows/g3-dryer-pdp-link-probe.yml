name: G3 dryer sampled PDP EnergyGuide link probe

on:
  workflow_dispatch:
    inputs:
      collection_run_id:
        description: Successful Dryer exact-SKU collection run ID (blank uses latest success)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/g3_dryer_pdp_link_probe.py'
      - '.github/workflows/g3-dryer-pdp-link-probe.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-dryer-pdp-link-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTION_RUN_ID: ${{ github.event.inputs.collection_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked Chromium runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Download successful Dryer PDP collection artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$COLLECTION_RUN_ID" ]; then
            COLLECTION_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-dryer-collection.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g3-dryer-collection.yml") | .id')"
          test "$VALID_RUN" = "$COLLECTION_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-dryer-collection-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g3-dryer/collection
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-dryer/collection.zip
          unzip -q runtime/g3-dryer/collection.zip -d runtime/g3-dryer/collection
          COLLECTION_FILE="$(find runtime/g3-dryer/collection -name collection-summary.json -type f -print -quit)"
          test -n "$COLLECTION_FILE"
          echo "COLLECTION_RUN_ID=${COLLECTION_RUN_ID}" >> "$GITHUB_ENV"
          echo "COLLECTION_DIR=$(dirname "$COLLECTION_FILE")" >> "$GITHUB_ENV"
      - name: Inspect three PDPs without canonical Energy Guides
        run: >-
          python scripts/g3_dryer_pdp_link_probe.py
          --collection-root "$COLLECTION_DIR"
          --collection-run-id "$COLLECTION_RUN_ID"
          --out runtime/g3-dryer/pdp-link-probe
      - name: Preserve sampled PDP link evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dryer-pdp-link-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3-dryer/pdp-link-probe/
          retention-days: 14
          if-no-files-found: error
