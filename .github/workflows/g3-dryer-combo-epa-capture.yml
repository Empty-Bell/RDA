name: G3 Dryer EPA combo component source capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g3_dryer_combo_epa_capture.py'
      - '.github/workflows/g3-dryer-combo-epa-capture.yml'

permissions:
  contents: read

concurrency:
  group: g3-dryer-combo-epa-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Capture current EPA Samsung combination washer/dryer rows
        run: python scripts/g3_dryer_combo_epa_capture.py --out runtime/g3-dryer/epa-combo
      - name: Preserve current EPA combo source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dryer-epa-combo-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3-dryer/epa-combo/
          retention-days: 14
          if-no-files-found: error
