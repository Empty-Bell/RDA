name: G3 dishwasher exact-SKU collection

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful G3 dishwasher source reconnaissance run ID (blank uses latest success)
        required: false
        type: string
  workflow_run:
    workflows: [G3 dishwasher source reconnaissance]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/g3_dishwasher_collect.py'
      - 'checks/g3/test_dishwasher_collect.py'
      - '.github/workflows/g3-dishwasher-collection.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-dishwasher-collection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked browser runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Verify dishwasher collection contracts
        run: python -m unittest checks/g3/test_dishwasher_collect.py -v
      - name: Download successful dishwasher source artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-dishwasher-source-recon.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g3-dishwasher-source-recon.yml") | .id')"
          test "$VALID_RUN" = "$SOURCE_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-dishwasher-source-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g3-dishwasher/recon
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-dishwasher/source.zip
          unzip -q runtime/g3-dishwasher/source.zip -d runtime/g3-dishwasher/recon
          RECON_FILE="$(find runtime/g3-dishwasher/recon -name recon.json -type f -print -quit)"
          test -n "$RECON_FILE"
          echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}" >> "$GITHUB_ENV"
          echo "SOURCE_RECON_DIR=$(dirname "$RECON_FILE")" >> "$GITHUB_ENV"
      - name: Collect PDP source facts for every exact SKU
        run: python scripts/g3_dishwasher_collect.py --recon-root "$SOURCE_RECON_DIR" --source-run-id "$SOURCE_RUN_ID" --out runtime/g3-dishwasher
      - name: Preserve exact-SKU collection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dishwasher-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/g3-dishwasher/collection-summary.json
            runtime/g3-dishwasher/population.json
            runtime/g3-dishwasher/products.json
            runtime/g3-dishwasher/pdp/
          retention-days: 14
          if-no-files-found: warn
