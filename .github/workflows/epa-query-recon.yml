name: Phase 0 EPA query contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/epa_queries.py', 'scripts/epa_recon.py', 'scripts/source_contract.py', 'tests/**', '.github/workflows/epa-query-recon.yml']
permissions:
  contents: read
concurrency:
  group: epa-query-${{ github.ref }}
  cancel-in-progress: false
jobs:
  epa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        family: [refrigerator, dishwasher, washer, tv, range, dryer, hood, monitor, computer]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify query boundaries
        run: python -m unittest discover -s tests -p 'test_epa_queries.py' -v
      - name: Observe EPA query contracts
        run: python scripts/epa_recon.py --family ${{ matrix.family }}
      - name: Preserve EPA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epa-query-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/epa-query/
          retention-days: 14
          if-no-files-found: error
