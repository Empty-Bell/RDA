name: G2 refrigerator dashboard contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g2_dashboard_build.py'
      - 'checks/g2/test_dashboard_build.py'
      - '.github/workflows/g2-dashboard-contracts.yml'

permissions:
  contents: read

jobs:
  dashboard-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Run dashboard contracts
        run: python -m unittest checks/g2/test_dashboard_build.py -v
