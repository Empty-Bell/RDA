name: G2 EPA current-index Samsung scope capture
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version-file: '.python-version'}
      - run: python scripts/g2_epa_current_index_samsung_capture.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g2-epa-current-index-samsung-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g2-epa-current-index-samsung-capture/
          retention-days: 14
          if-no-files-found: error
