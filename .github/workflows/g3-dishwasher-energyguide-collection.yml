name: G3 dishwasher EnergyGuide retrieval

on:
  workflow_dispatch:
    inputs:
      collection_run_id:
        description: Successful exact-SKU PDP collection run ID (blank uses latest success)
        required: false
        type: string
  workflow_run:
    workflows: [G3 dishwasher exact-SKU collection]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/g3_dishwasher_energyguide_collect.py'
      - 'checks/g3/test_dishwasher_energyguide_collect.py'
      - '.github/workflows/g3-dishwasher-energyguide-collection.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-dishwasher-energyguide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTION_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.collection_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Verify EnergyGuide retrieval contracts
        run: python -m unittest checks/g3/test_dishwasher_energyguide_collect.py -v
      - name: Download successful exact-SKU collection artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$COLLECTION_RUN_ID" ]; then
            COLLECTION_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-dishwasher-collection.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g3-dishwasher-collection.yml") | .id')"
          test "$VALID_RUN" = "$COLLECTION_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-dishwasher-collection-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g3-dishwasher/collection
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-dishwasher/collection.zip
          unzip -q runtime/g3-dishwasher/collection.zip -d runtime/g3-dishwasher/collection
          COLLECTION_FILE="$(find runtime/g3-dishwasher/collection -name collection-summary.json -type f -print -quit)"
          test -n "$COLLECTION_FILE"
          echo "COLLECTION_RUN_ID=${COLLECTION_RUN_ID}" >> "$GITHUB_ENV"
          echo "COLLECTION_DIR=$(dirname "$COLLECTION_FILE")" >> "$GITHUB_ENV"
      - name: Retrieve and hash every Support-declared PDF
        run: python scripts/g3_dishwasher_energyguide_collect.py --collection-root "$COLLECTION_DIR" --collection-run-id "$COLLECTION_RUN_ID" --out runtime/g3-dishwasher/energyguide
      - name: Preserve EnergyGuide retrieval evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dishwasher-energyguide-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3-dishwasher/energyguide/
          retention-days: 14
          if-no-files-found: error
