name: G2 EnergyGuide quality review

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful G2 refrigerator run ID (blank uses latest success)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/g2_label_quality_report.py'
      - 'scripts/g2_label_replay.py'
      - 'scripts/g2_label_selection.py'
      - 'scripts/g2_label_activation.py'
      - 'scripts/g2_energyguide_numeric_comparison.py'
      - 'scripts/g2_energyguide_numeric_assessment.py'
      - 'scripts/g2_epa_refrigerator_numeric_capture.py'
      - 'checks/g2/test_label_quality_report.py'
      - 'checks/g2/test_label_replay.py'
      - 'checks/g2/test_label_selection.py'
      - 'checks/g2/test_label_activation.py'
      - 'checks/g2/test_energyguide_numeric_comparison.py'
      - 'checks/g2/test_energyguide_numeric_assessment.py'
      - 'checks/g2/test_epa_refrigerator_numeric_capture.py'
      - 'docs/evidence/g2-label-review-annotations.json'
      - 'docs/evidence/g2-capacity-model-review.json'
      - 'notebooks/g2_energyguide_quality.ipynb'
      - '.github/workflows/g2-label-quality-review.yml'
  workflow_run:
    workflows: [G2 refrigerator observational pilot]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  profile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '' }}
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Run quality profiler regression
        env:
          PYTHONPATH: src:scripts
        run: |
          python -m unittest discover -s checks/g2 -p 'test_label_*.py' -v
          python -m unittest checks/g2/test_energyguide_numeric_comparison.py -v
          python -m unittest checks/g2/test_energyguide_numeric_assessment.py -v
          python -m unittest checks/g2/test_epa_refrigerator_numeric_capture.py -v
      - name: Resolve successful source run and download artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g2-smoke.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g2-smoke.yml") | .id')"
          test "$VALID_RUN" = "$SOURCE_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g2-pilot-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g2-label-quality
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g2-label-quality/source.zip
          echo "PROFILE_SOURCE_RUN_ID=${SOURCE_RUN_ID}" >> "$GITHUB_ENV"
      - name: Profile EnergyGuide source and review coverage
        run: |
          python scripts/g2_label_replay.py runtime/g2-label-quality/source.zip \
            --annual-review docs/evidence/g2-label-review-annotations.json \
            --capacity-review docs/evidence/g2-capacity-model-review.json \
            --output runtime/g2-label-quality/selection-replay.json
          python scripts/g2_label_quality_report.py runtime/g2-label-quality/source.zip \
            --github-run-id "$PROFILE_SOURCE_RUN_ID" \
            --selection-replay runtime/g2-label-quality/selection-replay.json \
            --json-output runtime/g2-label-quality/profile.json \
            --markdown-output runtime/g2-label-quality/profile.md
          python scripts/g2_epa_refrigerator_numeric_capture.py runtime/g2-label-quality/source.zip \
            --out runtime/g2-label-quality/epa-numeric
          python scripts/g2_energyguide_numeric_comparison.py runtime/g2-label-quality/source.zip \
            --selection-replay runtime/g2-label-quality/selection-replay.json \
            --epa-numeric runtime/g2-label-quality/epa-numeric/projection.json \
            --json-output runtime/g2-label-quality/numeric-comparison.json \
            --markdown-output runtime/g2-label-quality/numeric-comparison.md
          python scripts/g2_energyguide_numeric_assessment.py \
            runtime/g2-label-quality/numeric-comparison.json \
            --json-output runtime/g2-label-quality/numeric-assessment.json \
            --markdown-output runtime/g2-label-quality/numeric-assessment.md
          cat runtime/g2-label-quality/profile.md >> "$GITHUB_STEP_SUMMARY"
          cat runtime/g2-label-quality/numeric-comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat runtime/g2-label-quality/numeric-assessment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve quality profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g2-label-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/g2-label-quality/profile.json
            runtime/g2-label-quality/profile.md
            runtime/g2-label-quality/selection-replay.json
            runtime/g2-label-quality/numeric-comparison.json
            runtime/g2-label-quality/numeric-comparison.md
            runtime/g2-label-quality/numeric-assessment.json
            runtime/g2-label-quality/numeric-assessment.md
            runtime/g2-label-quality/epa-numeric/
          retention-days: 14
          if-no-files-found: error
