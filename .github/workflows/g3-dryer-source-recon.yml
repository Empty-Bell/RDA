name: G3 clothes dryer source reconnaissance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/source_recon.py'
      - 'scripts/source_contract.py'
      - 'scripts/g3_dryer_collect.py'
      - 'scripts/claim_recon.py'
      - 'scripts/browser_runtime.py'
      - 'scripts/bootstrap.sh'
      - 'scripts/runtime_integrity.py'
      - 'runtime-manifest.json'
      - '.python-version'
      - 'requirements-*.lock'
      - 'tests/test_dryer_contract.py'
      - '.github/workflows/g3-dryer-source-recon.yml'
      - '.github/workflows/g3-dryer-collection.yml'

permissions:
  contents: read

concurrency:
  group: g3-dryer-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconnaissance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked source runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Re-observe current dryer sources
        run: python scripts/source_recon.py --family dryer
      - name: Preserve dryer source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dryer-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/source-recon/dryer/
          retention-days: 14
          if-no-files-found: error
