name: Phase 0 product source contracts
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/source_recon.py', 'scripts/source_contract.py', 'scripts/claim_recon.py', 'scripts/energyguide_fields.py', 'scripts/energyguide_quality.py', 'scripts/browser_runtime.py', 'scripts/bootstrap.sh', 'scripts/bootstrap_record.py', 'scripts/runtime_integrity.py', 'runtime-manifest.json', '.python-version', 'requirements-*.lock', 'tests/**', '.github/workflows/source-recon.yml']
  push:
    branches: [main]
    paths: ['scripts/source_recon.py', 'scripts/source_contract.py', 'scripts/claim_recon.py', 'scripts/energyguide_fields.py', 'scripts/energyguide_quality.py', 'scripts/browser_runtime.py', 'scripts/bootstrap.sh', 'scripts/bootstrap_record.py', 'scripts/runtime_integrity.py', 'runtime-manifest.json', '.python-version', 'requirements-*.lock', 'tests/**', '.github/workflows/source-recon.yml']
permissions:
  contents: read
concurrency:
  group: source-recon-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    strategy:
      fail-fast: false
      matrix:
        family: [refrigerator, dishwasher, washer, tv, range, cooktop, dryer, hood, monitor, computer, chromebook, tablet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Observe source contracts
        run: |
          python -m unittest discover -s tests -t . -v
          python scripts/source_recon.py --family ${{ matrix.family }}
      - name: Observe label degradation and model ROI
        if: contains(fromJSON('["refrigerator","dishwasher","washer","tv"]'), matrix.family)
        run: python scripts/energyguide_quality.py --family ${{ matrix.family }}
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-recon-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          retention-days: 14
          if-no-files-found: error
