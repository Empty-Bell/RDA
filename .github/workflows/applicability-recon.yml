name: Phase 0 official applicability evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/applicability*.py', 'fixtures/applicability/**', '.github/workflows/applicability-recon.yml']
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Verify authority extraction boundaries
        run: python -m unittest scripts.applicability_test -v
      - name: Capture official authority and type observations
        run: python scripts/applicability_recon.py
      - name: Preserve authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applicability-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/applicability/
          retention-days: 14
          if-no-files-found: error
