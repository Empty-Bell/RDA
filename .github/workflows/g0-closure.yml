name: Phase 0 combined closure checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/g0_closure*.py', '.github/workflows/g0-closure.yml']
permissions:
  contents: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Replay combined contracts and recorded evidence
        run: python scripts/g0_closure.py
      - name: Preserve closure checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g0-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g0-closure.json
          retention-days: 14
          if-no-files-found: error
