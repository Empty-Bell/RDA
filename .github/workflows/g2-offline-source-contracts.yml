name: G2 offline source contracts
on:
  push:
    branches: [main]
    paths: ['scripts/g2_epa_wildcard_capture.py', 'scripts/g2_samsung_pair_capture.py', 'checks/g2/test_epa_wildcard_capture.py', 'checks/g2/test_samsung_pair_capture.py', 'tests/fixtures/g2-epa-wildcard/**', 'tests/fixtures/g2-samsung-pair/**', '.github/workflows/g2-offline-source-contracts.yml']
  pull_request:
    paths: ['scripts/g2_epa_wildcard_capture.py', 'scripts/g2_samsung_pair_capture.py', 'checks/g2/test_epa_wildcard_capture.py', 'checks/g2/test_samsung_pair_capture.py', 'tests/fixtures/g2-epa-wildcard/**', 'tests/fixtures/g2-samsung-pair/**', '.github/workflows/g2-offline-source-contracts.yml']
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-24.04
    strategy: {fail-fast: false, matrix: {python: ['3.11', '3.12']}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m unittest checks/g2/test_epa_wildcard_capture.py checks/g2/test_samsung_pair_capture.py -v
