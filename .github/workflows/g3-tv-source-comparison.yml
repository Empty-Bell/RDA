name: G3 television PDP label EPA source comparison candidates

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful TV label and EPA source-capture run ID (blank uses latest success)
        required: false
        type: string
  workflow_run:
    workflows: [G3 television label and EPA source capture]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-tv-source-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Install locked PDF and OCR runtime
        run: |
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir --require-hashes --no-deps -r requirements-tools.lock
          python -m pip install --index-url https://pypi.org/simple --no-cache-dir --require-hashes --no-deps --no-build-isolation -r requirements-probe.lock
          python -m pip check
          python scripts/runtime_integrity.py prepare
      - name: Download exact TV label, EPA, and PDP artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-tv-secondary-sources.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          VALID_SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and .path == ".github/workflows/g3-tv-secondary-sources.yml") | .id')"
          test "$VALID_SOURCE" = "$SOURCE_RUN_ID"
          fetch_artifact() {
            local run_id="$1" prefix="$2" dest="$3"
            local artifact_id
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq "[.artifacts[] | select(.expired == false) | select(.name | startswith(\"${prefix}\"))] | sort_by(.created_at) | last | .id")"
            test -n "$artifact_id"
            mkdir -p "$dest"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${dest}.zip"
            unzip -q "${dest}.zip" -d "$dest"
          }
          fetch_artifact "$SOURCE_RUN_ID" "g3-tv-energyguide-" runtime/g3-tv/retrieval
          fetch_artifact "$SOURCE_RUN_ID" "g3-tv-epa-" runtime/g3-tv/epa
          RETRIEVAL_SUMMARY="$(find runtime/g3-tv/retrieval -name energyguide-summary.json -type f -print -quit)"
          EPA_SUMMARY="$(find runtime/g3-tv/epa -name capture-summary.json -type f -print -quit)"
          test -n "$RETRIEVAL_SUMMARY"
          test -n "$EPA_SUMMARY"
          COLLECTION_RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["collection_run_id"])' "$RETRIEVAL_SUMMARY")"
          COLLECTION_VALID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${COLLECTION_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "success" and (.path == ".github/workflows/g3-tv-collection.yml" or .path == ".github/workflows/g3-tv-recovery.yml")) | .id')"
          test "$COLLECTION_VALID" = "$COLLECTION_RUN_ID"
          fetch_artifact "$COLLECTION_RUN_ID" "g3-tv-collection-" runtime/g3-tv/collection
          COLLECTION_SUMMARY="$(find runtime/g3-tv/collection -name collection-summary.json -type f -print -quit)"
          test -n "$COLLECTION_SUMMARY"
          echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}" >> "$GITHUB_ENV"
          echo "RETRIEVAL_DIR=$(dirname "$RETRIEVAL_SUMMARY")" >> "$GITHUB_ENV"
          echo "EPA_DIR=$(dirname "$EPA_SUMMARY")" >> "$GITHUB_ENV"
          echo "COLLECTION_RUN_ID=${COLLECTION_RUN_ID}" >> "$GITHUB_ENV"
          echo "COLLECTION_DIR=$(dirname "$COLLECTION_SUMMARY")" >> "$GITHUB_ENV"
      - name: Observe all unique EnergyGuide PDFs
        run: python scripts/g3_tv_energyguide_observe.py --retrieval-root "$RETRIEVAL_DIR" --retrieval-run-id "$SOURCE_RUN_ID" --out runtime/g3-tv/observation
      - name: Prepare raw OCR/model/annual-energy candidate table
        run: python scripts/g3_tv_energyguide_review_queue.py --observation-root runtime/g3-tv/observation --observation-run-id "$GITHUB_RUN_ID" --out runtime/g3-tv/review
      - name: Compare same-run PDP, label, and EPA candidates without grading
        run: python scripts/g3_tv_source_comparison.py --review-root runtime/g3-tv/review --collection-root "$COLLECTION_DIR" --collection-run-id "$COLLECTION_RUN_ID" --epa-root "$EPA_DIR" --epa-run-id "$SOURCE_RUN_ID" --out runtime/g3-tv/comparison
      - name: Preserve TV comparison candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-tv-source-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3-tv/comparison/
          retention-days: 14
          if-no-files-found: warn
