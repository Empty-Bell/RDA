name: G3 dishwasher report dashboard
on:
 workflow_dispatch:
 push:
  branches: [main]
  paths: ['scripts/g3_dishwasher_report_dashboard.py','.github/workflows/g3-dishwasher-report-dashboard.yml']
permissions: {actions: read, contents: read}
jobs:
 dashboard:
  runs-on: ubuntu-24.04
  timeout-minutes: 5
  env:
   GH_TOKEN: ${{ github.token }}
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
     with: {persist-credentials: false}
   - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
     with: {python-version-file: '.python-version'}
   - name: Download canonical report
     shell: bash
     run: |
      set -euo pipefail
      run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-dishwasher-report.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
      aid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '[.artifacts[]|select(.expired==false)|select(.name|startswith("g3-dishwasher-report-"))]|last|.id')"
      mkdir -p runtime/g3/report-dashboard/input;gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > runtime/g3/report-dashboard/input.zip;unzip -q runtime/g3/report-dashboard/input.zip -d runtime/g3/report-dashboard/input
   - name: Build dashboard
     run: python scripts/g3_dishwasher_report_dashboard.py --report "$(find runtime/g3/report-dashboard/input -name report.json -print -quit)" --out runtime/g3/report-dashboard/site
   - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
     with:
      name: g3-dishwasher-report-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
      path: runtime/g3/report-dashboard/site/
      retention-days: 14
