name: Phase 0 evidence integrity review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/evidence/*fixture-manifest.json', 'scripts/g0_evidence_review.py', '.github/workflows/g0-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Check fixture manifests against actual Ubuntu checkout bytes
        run: python scripts/g0_evidence_review.py
      - name: Preserve integrity review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g0-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g0-review.json
          retention-days: 14
          if-no-files-found: error
