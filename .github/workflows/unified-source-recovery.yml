name: Bounded unified source recovery

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed unified run to inspect without retrying
        required: true
        type: string
  workflow_run:
    workflows: [Unified 11-family full audit]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry-source:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Re-run only bounded family source failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            python scripts/retry_unified_run.py --repository '${{ github.repository }}' --run-id '${{ inputs.run_id }}' --max-attempts 3 --dry-run
          else
            python scripts/retry_unified_run.py --repository '${{ github.repository }}' --run-id '${{ github.event.workflow_run.id }}' --max-attempts 3
          fi
