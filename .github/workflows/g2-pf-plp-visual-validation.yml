name: G2 PF to rendered PLP visual calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/g2_pf_plp_visual_validation.py'
      - 'checks/g2/test_pf_plp_visual_validation.py'
      - 'scripts/g2_energy_star_publication_points.py'
      - 'scripts/source_recon.py'
      - 'scripts/source_contract.py'
      - 'scripts/claim_recon.py'
      - 'scripts/browser_runtime.py'
      - 'scripts/bootstrap.sh'
      - 'requirements-*.lock'
      - '.python-version'
      - '.github/workflows/g2-pf-plp-visual-validation.yml'

permissions:
  contents: read

concurrency:
  group: g2-pf-plp-visual-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked Samsung session collector
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Calibration contract regression
        run: python -m unittest checks/g2/test_pf_plp_visual_validation.py -v
      - name: Collect current PF and rendered PLP cards, then calibrate
        run: python scripts/g2_pf_plp_visual_validation.py --collect
      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g2-pf-plp-visual-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/g2-pf-plp-visual-validation/
            runtime/source-recon/refrigerator/plp-claim-observation.json
            runtime/source-recon/refrigerator/population-observation.json
            runtime/source-recon/refrigerator/recon.json
            runtime/source-recon/refrigerator/fixtures/pf-*.json
          retention-days: 14
          if-no-files-found: error
