name: G3 dishwasher source dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: [G3 dishwasher comparison package]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['scripts/g3_dishwasher_dashboard.py', '.github/workflows/g3-dishwasher-dashboard.yml']
permissions:
  actions: read
  contents: read
jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version-file: '.python-version'}
      - name: Download latest comparison package
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-dishwasher-comparison-package.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          aid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '[.artifacts[]|select(.expired==false)|select(.name|startswith("g3-dishwasher-comparison-"))]|sort_by(.created_at)|last|.id')"
          mkdir -p runtime/g3/dashboard; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > runtime/g3/dashboard/input.zip; unzip -q runtime/g3/dashboard/input.zip -d runtime/g3/dashboard/input
      - name: Build dashboard package
        run: python scripts/g3_dishwasher_dashboard.py --package "$(find runtime/g3/dashboard/input -name comparison-package.json -print -quit)" --out runtime/g3/dashboard/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dishwasher-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3/dashboard/site/
          retention-days: 14
