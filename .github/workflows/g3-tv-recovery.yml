name: G3 television failed-SKU recovery

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed G3 TV collection run ID (blank selects the latest failed collection)
        required: false
        type: string
  workflow_run:
    workflows: [G3 television exact-SKU collection]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: g3-tv-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Bootstrap locked browser runtime
        run: |
          mkdir -p runtime
          bash scripts/bootstrap.sh
      - name: Download failed collection evidence and retry this shard
        shell: bash
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.failed_run_id || '' }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -z "$FAILED_RUN_ID" ]; then
            FAILED_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-tv-collection.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "failure")] | sort_by(.run_number) | last | .id')"
          fi
          VALID_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" --jq 'select(.status == "completed" and .conclusion == "failure" and .path == ".github/workflows/g3-tv-collection.yml") | .id')"
          test "$VALID_RUN" = "$FAILED_RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-tv-collection-"))] | sort_by(.created_at) | last | .id')"
          test -n "$ARTIFACT_ID"
          mkdir -p runtime/g3-tv/original
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-tv/original.zip
          unzip -q runtime/g3-tv/original.zip -d runtime/g3-tv/original
          SUMMARY="$(find runtime/g3-tv/original -name collection-summary.json -type f -print -quit)"
          test -n "$SUMMARY"
          echo "FAILED_RUN_ID=${FAILED_RUN_ID}" >> "$GITHUB_ENV"
          echo "ORIGINAL_DIR=$(dirname "$SUMMARY")" >> "$GITHUB_ENV"
          python scripts/g3_tv_retry_shard.py --collection-root "$(dirname "$SUMMARY")" --shard-index "$SHARD_INDEX" --shard-count 8 --out runtime/g3-tv/retry
      - name: Preserve retry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-tv-retry-${{ github.run_id }}-${{ matrix.shard }}
          path: runtime/g3-tv/retry/
          retention-days: 14
          if-no-files-found: warn

  assemble:
    if: always() && needs.retry.result != 'cancelled' && needs.retry.result != 'skipped'
    needs: [retry]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: 'src:scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'
      - name: Download original collection and all completed retry shards
        shell: bash
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.failed_run_id || '' }}
        run: |
          set -euo pipefail
          if [ -z "$FAILED_RUN_ID" ]; then
            FAILED_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/g3-tv-collection.yml/runs?branch=main&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "failure")] | sort_by(.run_number) | last | .id')"
          fi
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("g3-tv-collection-"))] | sort_by(.created_at) | last | .id')"
          mkdir -p runtime/g3-tv/original runtime/g3-tv/retries
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > runtime/g3-tv/original.zip
          unzip -q runtime/g3-tv/original.zip -d runtime/g3-tv/original
          while IFS=$'\t' read -r artifact_id artifact_name; do
            [ -n "$artifact_id" ] || continue
            mkdir -p "runtime/g3-tv/retries/${artifact_name}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "runtime/g3-tv/${artifact_name}.zip"
            unzip -q "runtime/g3-tv/${artifact_name}.zip" -d "runtime/g3-tv/retries/${artifact_name}"
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"g3-tv-retry-${GITHUB_RUN_ID}-\")) | [.id,.name] | @tsv")
          SUMMARY="$(find runtime/g3-tv/original -name collection-summary.json -type f -print -quit)"
          echo "ORIGINAL_DIR=$(dirname "$SUMMARY")" >> "$GITHUB_ENV"
          echo "RETRY_DIR=runtime/g3-tv/retries" >> "$GITHUB_ENV"
          echo "FAILED_RUN_ID=${FAILED_RUN_ID}" >> "$GITHUB_ENV"
      - name: Assemble complete evidence and report remaining failures
        id: assemble
        continue-on-error: true
        run: python scripts/g3_tv_retry_aggregate.py --original-root "$ORIGINAL_DIR" --shards-root "$RETRY_DIR" --out runtime/g3-tv/combined --allow-unverified
      - name: Preserve combined full-population evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-tv-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/g3-tv/combined/collection-summary.json
            runtime/g3-tv/combined/population.json
            runtime/g3-tv/combined/products.json
            runtime/g3-tv/combined/pdp/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if recovery evidence is incomplete
        if: always()
        run: test "${{ steps.assemble.outcome }}" = success && test "${{ needs.retry.result }}" = success
