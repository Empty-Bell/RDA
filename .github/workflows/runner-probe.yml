name: Phase 0 hosted runner probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/runner-probe.yml', 'scripts/runner_probe.py', 'scripts/browser_runtime.py', 'scripts/bootstrap.sh', 'scripts/bootstrap_record.py', 'scripts/runtime_integrity.py', 'runtime-manifest.json', '.python-version', 'requirements-*.lock']

permissions:
  contents: read

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 / node24
        with:
          python-version-file: '.python-version'
      - name: Prepare diagnostics
        run: mkdir -p runtime
      - name: Install from cold start
        run: bash scripts/bootstrap.sh
      - name: Probe guardrail tests
        run: python -m unittest discover -s tests -v
      - name: Runtime and live source probe
        run: python scripts/runner_probe.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / node24
        with:
          name: phase0-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          retention-days: 14
          if-no-files-found: error
