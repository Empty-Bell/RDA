name: Phase 0 hosted runner probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/runner-probe.yml', 'scripts/**', 'tests/**', 'requirements-probe.txt']

permissions:
  contents: read

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare diagnostics
        run: mkdir -p runtime
      - name: Install from cold start
        run: bash scripts/bootstrap.sh
      - name: Probe guardrail tests
        run: python -m unittest discover -s tests -v
      - name: Runtime and live source probe
        run: python scripts/runner_probe.py
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase0-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/
          retention-days: 14
          if-no-files-found: error
