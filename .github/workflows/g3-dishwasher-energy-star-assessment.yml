name: G3 dishwasher Energy Star assessment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [G3 dishwasher source match]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  assess:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version-file: '.python-version'}
      - name: Download latest successful collection and source match
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/g3/es/{collection,match}
          download(){ workflow="$1"; prefix="$2"; target="$3"; run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"; aid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq "[.artifacts[]|select(.expired==false)|select(.name|startswith(\"$prefix\"))]|sort_by(.created_at)|last|.id")"; test -n "$aid"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > "$target/a.zip"; unzip -q "$target/a.zip" -d "$target"; }
          download g3-dishwasher-collection.yml g3-dishwasher-collection- runtime/g3/es/collection
          download g3-dishwasher-source-match.yml g3-dishwasher-source-match- runtime/g3/es/match
      - name: Apply approved three-point rule
        run: python scripts/g3_dishwasher_energy_star_assessment.py --collection-root "$(dirname "$(find runtime/g3/es/collection -name collection-summary.json -print -quit)")" --match "$(find runtime/g3/es/match -name match-report.json -print -quit)" --out runtime/g3/es/output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-dishwasher-energy-star-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/g3/es/output/
          retention-days: 14
